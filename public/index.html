<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virtual Room</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      main { max-width: 52rem; }
      form { display: flex; gap: 0.5rem; margin: 1rem 0; }
      input { flex: 1; padding: 0.5rem; }
      button { padding: 0.5rem 1rem; }
      [role="status"] { color: #444; }
      canvas { border: 1px solid #cbd5e1; display: block; height: auto; margin-top: 1rem; max-width: 100%; }
      #messages { list-style: none; max-height: 12rem; overflow-y: auto; padding: 0; }
      #messages li { padding: 0.15rem 0; }
      #chat-form { margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Virtual Room</h1>
      <form id="join-form">
        <label for="display-name">Display name</label>
        <input id="display-name" name="displayName" maxlength="20" autocomplete="nickname" required />
        <button type="submit">Join</button>
      </form>
      <p id="status" role="status">Enter a display name to join.</p>
      <p id="hint" hidden>Use WASD or arrow keys to move.</p>
      <canvas id="room-canvas" width="800" height="600" hidden></canvas>
      <section id="chat" hidden>
        <h2>Chat</h2>
        <ul id="messages" aria-live="polite"></ul>
        <form id="chat-form">
          <input id="chat-input" type="text" maxlength="200" autocomplete="off" placeholder="Message" />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>
    <script type="module" src="/client.js"></script>
  </body>
</html>
