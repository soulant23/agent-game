<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virtual Room</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Virtual Room</h1>
      <form id="join-form">
        <label for="display-name">Display name</label>
        <input id="display-name" name="displayName" maxlength="20" autocomplete="nickname" required />
        <button type="submit">Join</button>
      </form>
      <p id="status" data-state="disconnected" role="status">Enter a display name to join.</p>
      <p id="hint" hidden>Click the canvas to walk to a point. Click and drag to keep moving.</p>
      <canvas id="room-canvas" width="800" height="600" hidden></canvas>
      <section id="chat" hidden>
        <h2>Chat</h2>
        <ul id="messages" aria-live="polite"></ul>
        <form id="chat-form">
          <input id="chat-input" type="text" maxlength="200" autocomplete="off" placeholder="Message" />
          <button type="submit">Send</button>
        </form>
      </section>
      <section id="audio-controls" hidden>
        <button id="mic-toggle" type="button" aria-pressed="false">Mic on</button>
        <button id="mic-retry" type="button" hidden>Retry mic</button>
      </section>
      <div id="audio-host" hidden></div>
    </main>
    <script type="module" src="/client.js"></script>
  </body>
</html>
